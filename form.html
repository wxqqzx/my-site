<!DOCTYPE html>
<html lang="ru">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Gabriela&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400;1,700&family=Geologica:wght,CRSV@100..900,0&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт_визитка_Курасова_П-13</title>
</head>
<body>
    <div id="wrapper">
        <header class="clear">
            <a href="index.html" id="logo"><span class="purple">Сладкий</span> <i>момент</i></a>
            <nav id="mainnav">
            <ul>
                <li><a href="uslugi.html">Услуги</a></li>
                <li><a href="onas.html">О нас</a></li>
                <li><a href="klientiki.html">Клиенты</a></li>
                <li><a href="kontactiki.html">Контакты</a></li>
            </ul>
            </nav>
        </header>
        <main>
            <form action="" id="contact-form">
                <div class="form_item">
                    <label for="topic">Тема</label><br>
                        <select name="topic" id="topic">
                            <option value="1">Заказать услугу</option>
                            <option value="2">Оставить отзыв/замечание</option>
                            <option value="3">Предложить сотрудничество</option>
                            <option value="4">Другое</option>
                        </select>
                </div>
                <div class="form_item">
                    <label for="name">Имя</label><br>
                    <input name="name" id="name" type="text" placeholder="Введите ваше имя" required>
                </div>
                <div class="form_item">
                    <label for="tel">Номер телефона</label><br>
                    <input type="tel" name="tel" id="tel" placeholder="+7-123-456-78-90" required>
                </div>
                <div class="form_item">
                    <label for="email">Почта</label><br>
                    <input name="email" id="email" type="email" placeholder="pochta@gmail.com" required>
                </div>
                <div class="form_item">
                    <label for="textarea">Текст сообщения</label><br>
                    <textarea name="textarea" id="textarea" rows="5" placeholder="Введите ваше сообщение" required></textarea>
                </div>
                <div class="form_item">
                    <input name="name" id="name" type="submit" class="knopka">
                </div>
            </form>
        </main>
    </div>
    <footer>
        <p class="footer_block"><a href="form.html" class="link_form">Написать нам &#9650;</a></p>
        <p class="footer_block">&copy; Сладкий момент</p>
        <div class="footer_icons">
            <a href="https://ok.ru/" target= "_blank"><img src="img/ok.png" alt="ok" class="footer_img"></a>
            <a href="https://vk.ru/" target= "_blank"><img src="img/vk.png" alt="vk" class="footer_img"></a>
            <a href="https://mail.ru/" target= "_blank"><img src="img/mailru.png" alt="mail.ru" class="footer_img"></a>
        </div>
    </footer>
</body>
</html>
